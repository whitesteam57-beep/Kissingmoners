<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Номера | генератор номеров</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#0e0e0f;--c:#1a1a1d;--t:#f2f0ee;--d:#8a8a90;--b:#4f86ee;--g:#f5c542}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:12px 16px 110px}
.top{display:flex;gap:14px;align-items:center;font-weight:800;font-size:22px}.top small{display:block;font-weight:400;font-size:13px;color:var(--d)}
h1{font-size:34px;margin:18px 0 10px;letter-spacing:-1px}h2{font-size:15px;color:var(--d);letter-spacing:2px;margin:22px 0 8px;font-weight:600}
.card{background:var(--c);border-radius:20px;padding:16px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:999px;padding:16px 22px;font-weight:800;font-size:18px;background:#f2f0ee;color:#111;width:100%;cursor:pointer}
.btn.b{background:var(--b);color:#fff}.btn:disabled{opacity:.4}.pill{background:#2a2a2e;border:0;color:var(--t);border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}
.plate{display:flex;background:#f4f3ef;color:#111;border:3px solid #999;border-radius:12px;font-weight:800;align-items:stretch;width:fit-content;margin:0 auto;box-shadow:0 8px 30px #0008}
.plate .n{padding:2px 12px;font-size:42px;letter-spacing:1px}.plate .r{border-left:3px solid #999;padding:2px 8px;text-align:center;font-size:24px;line-height:1}.plate .r i{display:block;font-size:11px;font-style:normal}
.plate.s .n{font-size:20px;padding:1px 8px}.plate.s .r{font-size:13px;padding:1px 5px}.plate.s{border-width:2px}
.c0{--rc:#9aa}.c1{--rc:#4da6ff}.c2{--rc:#a855f7}.c3{--rc:#d946ef}.c4{--rc:#ef4444}
.rar{color:var(--rc);font-weight:800}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(448px,92%);background:#222a;backdrop-filter:blur(14px);border-radius:999px;display:flex;padding:6px;z-index:5}
.nav button{flex:1;background:0;border:0;color:var(--d);padding:12px 0;border-radius:999px;font-size:15px;font-weight:600}.nav .on{background:#2c2c30;color:var(--t)}
#m{position:fixed;inset:0;display:none;align-items:flex-end;background:#000a;z-index:9}#m.o{display:flex}
#m>div{background:#050505;width:100%;max-width:480px;margin:0 auto;border-radius:32px 32px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;text-align:center}
.days{display:flex;gap:4px;background:var(--c);border-radius:16px;padding:8px}.days div{flex:1;text-align:center;padding:8px 0;border-radius:12px;font-size:12px}.days .on{outline:2px solid var(--b);background:#223}
.garage{background:linear-gradient(135deg,#7ee8dc,#4db8ad);color:#073;border-radius:26px;padding:20px}.garage b{font-size:40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0;text-align:center;cursor:pointer}
.bar{height:6px;background:#2a2a2e;border-radius:9px;margin:8px 0}.bar i{display:block;height:100%;background:#f2f0ee;border-radius:9px}
.wheel{width:260px;height:260px;border-radius:50%;margin:10px auto;border:8px solid #333;background:conic-gradient(#222 0 12.5%,#5b2 0 25%,#222 0 37.5%,#639 0 50%,#222 0 62.5%,#a3a 0 75%,#222 0 87.5%,#a22 0);transition:transform 4s cubic-bezier(.1,.7,.1,1);position:relative}
.dim{color:var(--d)}.tag{color:#6f7bff;font-weight:700}.mini{font-size:13px}
</style><style>
#cut{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .7s;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
#cut::before,#cut::after{content:"";position:absolute;left:0;right:0;height:11vh;background:#000;z-index:3}#cut::before{top:0}#cut::after{bottom:0}
#cut .glow{position:absolute;width:140vw;height:60vh;background:radial-gradient(ellipse at center,#4f2a9a88,#1d2a5544 40%,transparent 70%);opacity:0;animation:cg 4s ease-in-out forwards}
@keyframes cg{0%{opacity:0;transform:scale(.6)}40%,70%{opacity:1;transform:scale(1)}100%{opacity:.4;transform:scale(1.2)}}
#cut .au{color:#9a9aa5;letter-spacing:10px;font-size:14px;font-weight:600;opacity:0;animation:cu 1s .5s ease-out forwards;z-index:2}
#cut .ln{width:0;height:2px;background:linear-gradient(90deg,transparent,#a78bfa,transparent);margin:14px 0;animation:cl 1.2s .9s ease-out forwards;z-index:2}
@keyframes cl{to{width:min(70vw,320px)}}
#cut .nm{display:flex;z-index:2;font-size:min(13vw,56px);font-weight:900;letter-spacing:3px;perspective:600px}
#cut .nm span{opacity:0;display:inline-block;transform:translateY(30px) rotateX(-90deg);background:linear-gradient(100deg,#22d3ee,#a78bfa,#f472b6,#fde047);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px #8b5cf6);animation:cn .7s cubic-bezier(.2,.8,.2,1) forwards,pxv 3s linear infinite}
@keyframes cn{to{opacity:1;transform:none}}
@keyframes cu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#cut .sk{position:absolute;bottom:15vh;color:#555;font-size:12px;letter-spacing:2px;z-index:4;opacity:0;animation:cu 1s 1.5s forwards}
#cut.out{opacity:0;pointer-events:none}
</style></head><body><div id="cut" onclick="cutEnd()"><div class="glow"></div><div class="au">АВТОР</div><div class="ln"></div><div class="nm"><span style="animation-delay:1.20s,0s">E</span><span style="animation-delay:1.32s,0s">D</span><span style="animation-delay:1.44s,0s">I</span><span style="animation-delay:1.56s,0s">T</span><span style="animation-delay:1.68s,0s">V</span><span style="animation-delay:1.80s,0s">O</span><span style="animation-delay:1.92s,0s">X</span><span style="animation-delay:2.04s,0s">X</span></div><div class="sk">НАЖМИ, ЧТОБЫ ПРОПУСТИТЬ</div></div><script>function cutEnd(){var c=document.getElementById('cut');if(!c||c.o)return;c.o=1;c.classList.add('out');setTimeout(function(){c.remove()},800)}setTimeout(cutEnd,4200)</script><div id="app"></div><div id="m"><div id="mc"></div></div>
<div class="nav" id="nav"></div>
<script>
const LT='АВЕКМНОРСТУХ',RG=[12,29,77,97,199,799,126,10,136,56,20,88,102,27,52,16,78,50,163],RN=['Обычный','Редкий','Эпический','Легендарный','Мифический'];
const $=id=>document.getElementById(id),rd=a=>a[Math.random()*a.length|0];
const fm=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace('.',',')+' млн':Math.round(n).toLocaleString('ru');
const day=()=>new Date().toDateString();
let S={rub:50000,bolt:40,stars:0,lvl:1,xp:0,spins:0,tk:0,tkToday:0,tkDay:'',mult:10,garage:[],cap:14,farm:0,gold:0,nick:'player',dayN:1,last:'',ymd:'',boxes:[],best:0,total:0,tab:0,buyRub:0};
try{if(localStorage.getItem('nm_wipe')!='3'){localStorage.removeItem('nm1');localStorage.removeItem('nmtop');localStorage.removeItem('nmchat');localStorage.setItem('nm_wipe','3')}}catch(e){}
try{Object.assign(S,JSON.parse(localStorage.getItem('nm1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('nm1',JSON.stringify(S))}catch(e){}};
const need=()=>3+S.lvl*6;
function mk(force,min){let f=S.farm>0?[1,2,4,2,1]:[1,1,1,1,1],w=[70,22,6.5,1.4,.1].map((x,i)=>x*f[i]*Math.pow(lk(),i)),r=force;
 if(r==null){let t=w.reduce((a,b)=>a+b),x=Math.random()*t;r=0;while(x>w[r]){x-=w[r];r++}if(min!=null&&r<min)r=min}
 const dg=()=>rd([...'123456789']);let d,l2,l3,tg=[],a=rd(LT),x=dg(),mu=1;
 const dist=()=>{let s=new Set();while(s.size<3)s.add(rd([...'0123456789']));return[...s].join('')};
 l2=rd(LT);l3=rd(LT);
 if(r==0){d=dist();while(l3==l2)l3=rd(LT)}
 else if(r==1){if(Math.random()<.5){d=x+(y=dg())+y;var y;tg.push('Дубль '+d.slice(1)+' ×4');mu*=4;while(l3==l2)l3=rd(LT)}else{d=dist();l3=l2;tg.push('Две одинаковые буквы ×1.3')}}
 else if(r==2){d=x+x+x;tg.push('Тройка '+d+' ×20');while(l3==l2)l3=rd(LT)}
 else if(r==3){d=Math.random()<.5?x+x+x:'00'+x;l3=l2;tg.push(d[0]==0?'Первая сотня ×10':'Тройка ×20','Две одинаковые буквы ×1.3')}
 else{d=x+x+x;l2=l3=a;tg.push('Тройка ×20','Три одинаковые буквы ×3')}
 let reg=r>=4?rd([77,97,199,799]):rd(RG),base=[900,22000,320000,3200000,25e6][r],p=Math.round(base*(.6+Math.random())*mu**.3/100)*100;
 return{l:a,d,s:l2+l3,g:reg,r,p:Math.max(p,100),tg}}
var plate=(p,s)=>`<div class="plate ${s?'s':''}"><div class="n">${p.l}${p.d}${p.s}</div><div class="r">${p.g}<i>RUS</i></div></div>`;
const cap=()=>S.rub+S.garage.reduce((a,p)=>a+p.p,0);
function addXp(n){S.xp+=n;while(S.xp>=need()){S.xp-=need();S.lvl++;S.bolt+=5}}
function modal(h){$('mc').innerHTML=h;$('m').classList.add('o')}
function closeM(){$('m').classList.remove('o');R()}
$('m').onclick=e=>{if(e.target.id=='m')closeM()};
function spin(){const m=S.mult;if(S.bolt<m)return modal(`<h2>Не хватает молний</h2><p class="dim">Загляни в магазин или забери подарок дня</p><button class="btn" onclick="S.tab=2;closeM()">В магазин</button>`);
 S.bolt-=m;let best=null,sold=0;
 for(let i=0;i<m;i++){let p;if(S.gold>0){p=mk(null,2);S.gold--}else p=mk();if(S.farm>0)S.farm--;S.spins++;S.total++;
  if(S.spins%100==0&&S.tkDay!=day()||S.spins%100==0){S.tk++}
  if(!best||p.p>best.p){if(best){S.rub+=best.p;sold+=best.p}best=p}else{S.rub+=p.p;sold+=p.p}}
 addXp(m);if(best.p>S.best)S.best=best.p;save();
 modal(`<div class="dim">${m>1?'Лучший из '+m+' круток':'Результат'}</div><div style="margin:16px 0">${plate(best)}</div><div class="rar c${best.r}" style="font-size:30px">${RN[best.r]}</div>
 <div style="font-size:40px;font-weight:800">${fm(best.p)} ₽</div><div class="tag mini">${best.tg.join(' · ')}</div>
 ${sold?`<p class="dim mini">Остальные проданы за ${fm(sold)} ₽</p>`:''}
 <div class="row" style="margin-top:14px"><button class="btn" onclick="toG()">В гараж</button><button class="btn b" onclick="sell()">Продать</button></div>`);window.cur=best}
function toG(){if(S.garage.length>=S.cap){alert('Гараж полон! Продай номер или расширь гараж.');return}S.garage.push(cur);save();closeM()}
function sell(){S.rub+=cur.p;save();closeM()}
function claim(){const ds=[10,15,'r',20,'e',25,'g'],v=ds[S.dayN-1];if(typeof v=='number')S.bolt+=v;else if(v=='r'){cur=mk(1);S.garage.length<S.cap&&S.garage.push(cur);S.bolt+=0}else if(v=='e'){cur=mk(2);S.garage.length<S.cap&&S.garage.push(cur)}else{S.gold++;S.bolt+=0}
 S.last=day();S.dayN=S.dayN%7+1;save();closeM()}
function daily(){if(S.last==day())return;let y=new Date(Date.now()-864e5).toDateString();if(S.last&&S.last!=y)S.dayN=1;
 const lb=['10','15','редкий','20','эпик','25','золото'];
 modal(`<h2 style="color:var(--t);font-size:22px">Подарок дня</h2><div style="font-size:60px">⚡</div><div style="font-size:50px;font-weight:800">${lb[S.dayN-1]}</div>
 <div class="dim mini" style="text-align:left;margin:14px 0 6px">ДЕНЬ ${S.dayN}</div><div class="days">${lb.map((x,i)=>`<div class="${i+1==S.dayN?'on':''}">${i+1}<br>${x}</div>`).join('')}</div>
 <button class="btn b" style="margin-top:14px" onclick="claim()">Забрать</button><p class="dim mini">Пропустишь день — серия начнётся с первого.</p>`)}
function box(){return S.lvl<20}
function R(){const t=S.tab,A=$('app');$('nav').innerHTML=['Игра','Гараж','Магазин','Топ','👤'].map((x,i)=>`<button class="${i==t?'on':''}" onclick="S.tab=${i};R()">${x}</button>`).join('');
 let h=`<div class="top"><div>${fm(S.rub)} ₽<small>Удача ×${lk().toFixed(2)}</small></div><div style="color:var(--g)">⚡ ${S.bolt}</div></div>`;
 if(t==0){const nx=S.lvl<20?'Боксы с 20 уровня':'Боксы открыты';
  h+=`<div id="box">${S.view=='box'?bx():`<div style="margin:30px 0">${plate({l:'Р',d:'066',s:'АА',g:12})}</div>
  <div class="card"><div class="row"><b>Уровень ${S.lvl} · ${S.xp}/${need()}</b><span class="dim">Дальше: бонус ⚡</span></div><div class="bar"><i style="width:${S.xp/need()*100}%"></i></div></div>
  <div class="card row" onclick="S.view='box';R()" style="cursor:pointer"><b>Боксы</b><span class="dim">${nx} ›</span></div>
  ${S.gold?`<div class="card" style="border:1px solid var(--g)">Золотая крутка: ${S.gold} (эпик и выше)</div>`:''}
  ${S.farm?`<div class="card">Фарт: осталось ${S.farm} круток</div>`:''}
  <div class="row" style="margin-top:30px"><button class="pill" onclick="S.mult=S.mult==1?5:S.mult==5?10:1;R()" style="font-size:22px">×${S.mult}</button><button class="btn" onclick="spin()">Крутить <span class="pill">⚡ ${S.mult}</span></button></div>`}</div>`}
 if(t==1){const v=S.garage.reduce((a,p)=>a+p.p,0);
  h+=`<h1>ГАРАЖ</h1><div class="garage"><div class="mini">СТОИМОСТЬ ГАРАЖА</div><div class="row"><b>${fm(v)} ₽</b><b style="font-size:30px">${S.garage.length}/${S.cap}</b></div>
  <button class="pill" onclick="buyCap()" style="margin-top:10px;background:#0002;color:#063">+2 МЕСТА · ${fm(200000*2**S.buyRub)} ₽</button></div>
  <h2>НОМЕРА <a style="float:right;color:var(--b);letter-spacing:0;font-size:16px" onclick="contract()">Контракт 5 → 1</a></h2>
  ${S.garage.length?`<div class="grid">${S.garage.map((p,i)=>`<div class="card" onclick="gm(${i})">${plate(p,1)}<div class="rar c${p.r} mini">${RN[p.r]}</div><b>${fm(p.p)} ₽</b></div>`).join('')}</div>`:'<p class="dim" style="text-align:center;margin-top:60px">Пусто. Выбей номер и нажми «В гараж» — лучшие собираются здесь.</p>'}`}
 if(t==2)h+=shop();
 if(t==3)h+=topTab();
 if(t==4)h+=prof();
 A.innerHTML=h;save()}
function gm(i){const p=S.garage[i];modal(`${plate(p)}<div class="rar c${p.r}" style="font-size:26px;margin:10px">${RN[p.r]}</div><b style="font-size:32px">${fm(p.p)} ₽</b><div class="tag mini">${p.tg.join(' · ')}</div><button class="btn b" style="margin-top:14px" onclick="S.rub+=S.garage[${i}].p;S.garage.splice(${i},1);closeM()">Продать</button>`)}
function buyCap(){const c=200000*2**S.buyRub;if(S.rub<c)return alert('Не хватает рублей');S.rub-=c;S.cap+=2;S.buyRub++;R()}
function contract(){if(S.garage.length<5)return alert('Нужно минимум 5 номеров');const s=[...S.garage].sort((a,b)=>a.p-b.p).slice(0,5),mr=Math.max(...s.map(p=>p.r));if(mr>=4)return alert('Эти номера уже мифические');
 s.forEach(p=>S.garage.splice(S.garage.indexOf(p),1));cur=mk(mr+1);S.garage.push(cur);save();modal(`<div class="dim">Контракт выполнен</div><div style="margin:16px 0">${plate(cur)}</div><div class="rar c${cur.r}" style="font-size:28px">${RN[cur.r]}</div><b style="font-size:34px">${fm(cur.p)} ₽</b><button class="btn" style="margin-top:14px" onclick="closeM()">Круто</button>`)}
function bx(){if(box())return`<h1>БОКСЫ</h1><button class="pill" onclick="S.view='';R()">НАЗАД</button><p class="dim">Заказываешь за рубли — номер приходит по таймеру. Можно ускорить за звёзды.</p><p>Боксы — с 20 уровня. У тебя ${S.lvl}.</p><div class="grid"><div class="card dim" style="height:300px;display:flex;align-items:center;justify-content:center;border:1px dashed #444">Свободно<br>с 20 уровня</div><div class="card dim" style="height:300px;display:flex;align-items:center;justify-content:center;border:1px dashed #444">Свободно<br>с 20 уровня</div></div><div class="card row"><div><b>+ 3-й слот</b><br><span class="dim">Три бокса одновременно</span></div><button class="pill" onclick="alert('Откроется с 20 уровня')">⭐ 149</button></div><p class="dim mini">Для теста можно поднять уровень в профиле.</p>`;
 let h=`<h1>БОКСЫ</h1><button class="pill" onclick="S.view='';R()">НАЗАД</button><div class="grid" style="margin-top:14px">`;
 for(let i=0;i<2;i++){const b=S.boxes[i];h+=b?`<div class="card" style="height:200px"><b>Бокс</b><br><span class="dim" id="tm${i}"></span><br><br>${Date.now()>=b.t?`<button class="pill" onclick="open_(${i})">Открыть</button>`:`<button class="pill" onclick="S.stars>=5?(S.stars-=5,S.boxes[${i}].t=0,R()):alert('Нужно 5 ⭐')">⭐ 5 ускорить</button>`}</div>`:`<div class="card" style="height:200px;border:1px dashed #444"><button class="pill" onclick="order(${i})">Заказать · 50 000 ₽</button></div>`}
 return h+'</div>'}
function order(i){if(S.rub<5e4)return alert('Не хватает рублей');S.rub-=5e4;S.boxes[i]={t:Date.now()+30000};R()}
function open_(i){S.boxes[i]=null;cur=mk(null,1);modal(`<div class="dim">Из бокса</div><div style="margin:16px 0">${plate(cur)}</div><div class="rar c${cur.r}" style="font-size:28px">${RN[cur.r]}</div><b style="font-size:34px">${fm(cur.p)} ₽</b><div class="row" style="margin-top:14px"><button class="btn" onclick="toG()">В гараж</button><button class="btn b" onclick="sell()">Продать</button></div>`)}
function shop(){const st=(n,fn)=>S.stars>=n?(S.stars-=n,fn(),R()):alert('Не хватает ⭐. Нажми «Получить 500 ⭐» вверху.');window.st=st;
 const it=(a,b,c,fn)=>`<div class="card row"><div><b>${a}</b><br><span class="dim mini">${b}</span></div><button class="pill" onclick="${fn}">${c}</button></div>`;
 return`<h1>МАГАЗИН</h1><button class="btn b" onclick="S.stars+=500;R()">Получить 500 ⭐ (демо)</button><p class="dim">Баланс: ⭐ ${S.stars}. Это игровая валюта — реальные платежи не подключены.</p>
 <div class="card" style="border:1px solid #5a4a20"><div class="mini dim">ЛУЧШЕЕ В МАГАЗИНЕ</div><h1 style="margin:6px 0">ЗОЛОТАЯ КРУТКА</h1><div class="dim">Следующая крутка — эпический номер или выше.</div><div class="row" style="margin:12px 0"><b>100% Эпик+</b><b>13% Легенда+</b></div><button class="btn" onclick="st(49,()=>S.gold++)">КУПИТЬ ⭐ 49</button></div>
 <h2>МОЛНИИ</h2><div class="grid" style="grid-template-columns:1fr 1fr 1fr">${[[20,25],[60,65],[150,150]].map(([a,b])=>`<div class="card"><b style="font-size:28px">${a}</b><br>⚡<br><button class="pill" onclick="st(${b},()=>S.bolt+=${a})">⭐ ${b}</button></div>`).join('')}</div>
 ${it('10 молний за рубли','Опыта уровня не дают','124 000 ₽',"S.rub>=124000?(S.rub-=124000,S.bolt+=10,R()):alert('Не хватает ₽')")}
 <h2>УДАЧА</h2>${it('Фарт на 50 круток','Редкие ×2 · эпики ×4 · леги ×2','⭐ 75',"st(75,()=>S.farm+=50)")}
 <h2>ГАРАЖ</h2>${it('Гараж +4 места','За звёзды — до +12 мест','⭐ 75',"st(75,()=>S.cap+=4)")}${it('Гараж +2 места за рубли','Каждые следующие вдвое дороже','200 000 ₽',"buyCap()")}`}

const BPH=['Привет всем!','Кто выбил легенду?','Только что выбил тройку 😎','Кто продаёт 777?','Как получить префикс?','Колесо удачи выдало эпик!','Всем удачных круток','Нужен регион 199, меняю','Гараж почти полный, надо слить','Кто в топе сегодня?','Счастливый час начался, крутите!','Магнат — вот это цель 💎'];
function cLoad(){try{CM=JSON.parse(localStorage.getItem('nmchat')||'[]')}catch(e){CM=[]}}
function cAll(){return[...CM,...CB].sort((a,b)=>a.t-b.t).slice(-80)}
function cRow(m){const me=m.u==S.id,d=new Date(m.t),tm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 return`<div style="margin:9px 0;text-align:${me?'right':'left'}"><div class="mini" style="margin-bottom:3px">${m.px?pxH(m.px):''} <b>${esc(m.n)}</b>${m.bot?' <span class="dim" style="font-size:10px;border:1px solid #444;border-radius:6px;padding:0 4px">БОТ</span>':''} <span class="dim" style="font-size:11px">${tm}</span></div><div style="background:${me?'#1d3a78':'#1a1a1d'};border-radius:16px;padding:9px 13px;display:inline-block;max-width:92%;word-break:break-word;text-align:left">${esc(m.x)}</div></div>`}
function cDraw(){const e=$('cl');if(!e)return;const a=cAll();e.innerHTML=a.length?a.map(cRow).join(''):'<p class="dim mini" style="text-align:center;margin-top:30px">Пока тихо. Напиши первым!</p>';e.scrollTop=e.scrollHeight}
function cSend(){const i=$('ci');if(!i)return;const x=i.value.trim().slice(0,200);if(!x)return;if(Date.now()-clast<2000)return toast('Не так быстро');clast=Date.now();
 cLoad();CM.push({t:Date.now(),u:S.id,n:S.nick,px:pxCur(),x});CM=CM.slice(-100);try{localStorage.setItem('nmchat',JSON.stringify(CM))}catch(e){}i.value='';cdraft='';cDraw()}
function cClear(){CM=[];CB=[];try{localStorage.setItem('nmchat','[]')}catch(e){}cDraw();toast('Чат очищен')}
function cBot(){const px=rd(['new','new','new','racer','lucky','vet','legend','mag']);CB.push({t:Date.now(),u:'bot',bot:1,n:rd(NMS),px,x:rd(BPH)});CB=CB.slice(-30)}
function chatH(){cLoad();if(!CB.length)for(let i=0;i<4;i++){cBot();CB[i].t=Date.now()-(4-i)*90000}
 return`<div class="dim" onclick="S.view='';R()" style="padding:6px 0">‹ Назад</div><h1 style="margin-top:4px">ЧАТ</h1><p class="dim mini" style="margin:0 0 8px">Игроки с пометкой БОТ — виртуальные. Сообщения сохраняются на этом устройстве; чтобы чат связывал разные телефоны, нужен сервер.</p><div id="cl" style="height:50vh;overflow-y:auto;background:#0b0b0d;border-radius:20px;padding:4px 14px"></div><div class="row" style="margin-top:10px"><input id="ci" class="cin" maxlength="200" placeholder="Сообщение…" autocomplete="off" oninput="cdraft=this.value" onkeydown="if(event.key=='Enter')cSend()"><button class="pill" style="padding:14px 18px" onclick="cSend()">➤</button></div>${S.admin?`<button class="pill" style="margin-top:10px" onclick="cClear()">🧹 Очистить чат (админ)</button>`:''}`}
window.addEventListener('storage',e=>{if(e.key=='nmchat'){cLoad();cDraw()}});
setInterval(()=>{if(S.view=='chat'&&S.tab==0&&!document.hidden&&Math.random()<.6){cBot();cDraw()}},12000);
const _gC=game;game=function(){if(S.view=='chat')return chatH();const h=_gC();return S.view?h:h.replace('угадай цену</small></div>','угадай цену</small></div><div class="tile2" onclick="S.view=\'chat\';R()"><span>💬</span>Чат<small>общение игроков</small></div>')};
const _RC=R;R=function(){_RC();if(S.view=='chat'&&S.tab==0){cDraw();const i=$('ci');if(i)i.value=cdraft}};
R();
</script>
<script>
const TOPMS=20*60*1000;
function topLoad(){try{return JSON.parse(localStorage.getItem('nmtop')||'{}')}catch(e){return{}}}
function topSnap(){const rows=topLoad();rows[S.id]={id:S.id,n:S.nick,c:Math.round(cap()),b:S.best||0,px:pxCur(),t:Date.now()};try{localStorage.setItem('nmtop',JSON.stringify(rows))}catch(e){}S.topT=Date.now()}
function plRef(){const rows=topLoad();PL.length=0;Object.values(rows).forEach(r=>{if(r.id!=S.id)PL.push({n:r.n,id:r.id,u:'@'+String(r.n).toLowerCase().replace(/\W/g,'_')})})}
function topChk(){if(!S.topT||Date.now()-S.topT>=TOPMS||!topLoad()[S.id]){topSnap();return 1}return 0}
const topLeft=()=>Math.max(0,Math.ceil((TOPMS-(Date.now()-(S.topT||0)))/1000));
function topBoard(){const rows=Object.values(topLoad()),k=S.sort?'b':'c';rows.sort((a,b)=>b[k]-a[k]);
 const px=r=>r.id==S.id?pxCur():(S.pxp[r.id]&&S.pxp[r.id].s)||r.px||'new',lst=S.all?rows.slice(0,50):rows.slice(0,10),mi=rows.findIndex(r=>r.id==S.id);
 const row=(r,i,me)=>`<div class="card row" style="${me?'border:1px solid var(--b);':i==0?'background:#e9a63a;color:#111;':''}padding:12px"><b>${i+1}</b><b style="flex:1;margin-left:10px;text-align:left">${pxH(px(r))} ${esc(r.n)}</b><b>${fm(r[k])} ₽</b></div>`;
 return`<h1 style="font-size:24px;margin-top:26px">${S.sort?'Лучшие номера':'Самые богатые'} <span class="pill" style="float:right" onclick="S.sort=S.sort?0:1;R()">⇅</span></h1><div class="dim mini">${S.sort?'Самый дорогой номер':'Рубли + стоимость гаража'}</div><div class="dim mini" style="margin:4px 0 8px">⏱ Рейтинг обновляется каждые 20 минут · следующее через <b id="tt">${mmss(topLeft())}</b></div>`
 +lst.map((r,i)=>row(r,i,r.id==S.id)).join('')+(mi>=lst.length?row(rows[mi],mi,1):'')
 +(rows.length>10?`<button class="btn" style="background:#222;color:#fff;box-shadow:none;font-size:15px" onclick="S.all=!S.all;R()">${S.all?'Свернуть':'Показать всех · '+Math.min(50,rows.length)}</button>`:'')}
const _tT=topH;topH=function(){return _tT().replace(/<h1 style="font-size:24px;margin-top:26px">[\s\S]*$/,topBoard())};
setInterval(()=>{const e=$('tt');if(e)e.textContent=mmss(topLeft());if(topLeft()<=0){topSnap();plRef();if(S.tab==3&&!S.view&&!$('m').classList.contains('o')&&!document.hidden)R()}},1000);
const _RT=R;R=function(){topChk();plRef();_RT()};
R();
</script>
</body></html>
